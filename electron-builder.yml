appId: com.hariskhan.inventory-finance
productName: Inventory Finance Management System
copyright: Copyright © 2025 Haris Khan

afterPack: scripts/afterPack.js

directories:
  output: dist
  buildResources: build-resources

files:
  - frontend/build/**/*
  - frontend/electron/**/*
  - package.json
  - "!**/*.map"
  - "!**/.git"

extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!node_modules/**/*"
      - "!logs/**/*"
      - "!*.log"
      - "!.env.example"
      - "!*.md"
      - "!test/**/*"
      - "!tests/**/*"

  - from: backend/node_modules
    to: backend/node_modules

  - from: backend/.env
    to: backend/.env

win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: frontend/build/icon.ico
  certificateSubjectName: null
  verifyUpdateCodeSignature: false
  sign: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Inventory Finance System
  # installerIcon: frontend/build/icon.ico
  # uninstallerIcon: frontend/build/icon.ico
  # installerHeader: frontend/build/icon.ico
  # installerHeaderIcon: frontend/build/icon.ico
  deleteAppDataOnUninstall: false

publish: null
